th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;max-width:340px}th:first-child{z-index:3}
td.t{text-align:left}tr:hover td{background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:6px;float:left;margin-right:8px;background:var(--line)}

.tag.off{background:var(--bad-bg);color:var(--bad)}.tag.scale{background:var(--good-bg);color:var(--good)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.good{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 26px;position:relative;overflow-x:auto}
.bar{flex:1 0 10px;min-width:10px;background:var(--acc);border-radius:3px 3px 0 0;position:relative}.bar i{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mute);font-style:normal;white-space:nowrap}
.bar.zero{background:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}select{font:600 13px Manrope;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}

ul.h{margin:0;padding-left:18px}ul.h li{margin:6px 0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--mute)}

const COLS=(first)=>[[first[0],first[1],()=>'t'],['Расход',r=>money(r.spend)],['Заявки',r=>n(r.res)],['Цена заявки',r=>money(r.cpl),r=>cls(r.cpl,T*0.9,T*1.5,true)],['CTR',r=>pct(r.ctr),r=>cls(r.ctr,B.ctr,1.2),'opt'],['До стр.',r=>r.lpv_rate==null?'—':fm(r.lpv_rate,0)+'%',r=>cls(r.lpv_rate,80,65),'opt'],['Стр. → заявка',r=>pct(r.page_cr),r=>cls(r.page_cr,B.page_cr+1,4)],['CPM',r=>money(r.cpm),null,'opt']];
function bars(rows,key,label){const mx=Math.max(...rows.map(r=>r[key]||0),1);return `<div class="bars">${rows.map(r=>`<div class="bar ${r[key]?'':'zero'}" style="height:${Math.max(2,100*(r[key]||0)/mx)}%" title="${label(r)}"><i>${(r.key||r.date).slice(-5).replace('-','.')}</i></div>`).join('')}</div>`}
const delta=(a,b,lower)=>{if(a==null||b==null||!b)return'';const d=100*(a-b)/b,good=lower?d<0:d>0;return `<span class="d ${good?'up':'dn'}">${d>0?'+':''}${fm(d,0)}% к 7 дн.</span>`};

// ---------- Вчера
(function(){const L=DATA.latest,el=$('#s-day');
 if(!L){el.innerHTML='<div class="empty">Ежедневных отчётов ещё нет. Запусти <b>daily.py</b> или дождись утреннего запуска.</div>';return}
 if(!L.active){el.innerHTML=`<p class="lead">${L.date}: реклама не крутилась — все кампании на паузе.</p><div class="empty">Как только в кабинете появится активная кампания, здесь будут итоги дня, лучшие и худшие объявления и что сделать. Пока смотри вкладку «Прошлый запуск 06.05» — это ориентиры для нового запуска.</div>`+histBlock();return}
 const t=L.total_day,w=L.total_7,a=x=>w&&w.spend?x/7:null;
 const verdictLine=t.res&&t.cpl<=T?`Вчера заявка стоила ${money(t.cpl)} — в пределах цели ${T} $.`:t.res?`Вчера заявка стоила ${money(t.cpl)} — дороже цели ${T} $.`:`Вчера потрачено ${money(t.spend)} без заявок.`;
 el.innerHTML=`<p class="lead">${verdictLine}</p>
 <div class="kpis">
  <div class="kpi"><small>Расход</small><b>${money(t.spend)}</b>${delta(t.spend,a(w.spend))}</div>
  <div class="kpi"><small>Заявки</small><b>${n(t.res)}</b>${delta(t.res,a(w.res))}</div>
  <div class="kpi"><small>Цена заявки · цель ${T} $</small><b class="${cls(t.cpl,T*0.9,T*1.5,true)}">${money(t.cpl)}</b>${delta(t.cpl,w.cpl,true)}</div>
  <div class="kpi"><small>CTR по ссылке</small><b>${pct(t.ctr)}</b>${delta(t.ctr,w.ctr)}</div>
  <div class="kpi"><small>Дошли до страницы</small><b>${t.lpv_rate==null?'—':fm(t.lpv_rate,0)+'%'}</b>${delta(t.lpv_rate,w.lpv_rate)}</div>
  <div class="kpi"><small>Страница → заявка</small><b>${pct(t.page_cr)}</b>${delta(t.page_cr,w.page_cr)}</div>
 </div>
 ${t.res<5?'<div class="empty">За день меньше 5 заявок — по одному дню выводов не делаем, решения ниже — по 7–14 дням.</div>':''}
 <h2>Что сделать</h2><div class="cards">${(L.actions||[]).map(x=>`<div class="card ${x.kind}"><b>${CONF[x.conf]} ${x.kind==='off'?'⏸ Выключить':'⬆️ Масштабировать'}: ${x.who}</b>${x.text}${x.note?`<br><small>${x.note}</small>`:''}</div>`).join('')||'<div class="card">Объявлений и групп на выключение или масштабирование нет.</div>'}</div>
 <h2>Гипотезы — по деньгам под риском</h2><div class="cards">${L.hypotheses.map(h=>`<div class="card"><b>${CONF[h.conf]} ${h.status&&h.status!=='новая'?'в журнале: '+h.status:'новая'}</b>${h.text}${h.result?`<br><small>Результат: ${h.result}</small>`:''}</div>`).join('')}</div>
 <p class="sub">🟢 можно действовать · 🟡 сигнал, проверить · ⚪ мало данных. Насколько правила точны — вкладка «Надёжность».</p>
 <h2>Объявления вчера</h2>${table(COLS(['Объявление · группа',r=>`<b>${r.ad_name}</b><br><small>${r.adset_name} · ${r.campaign_name}</small>`]),L.ads_day.sort((a,b)=>b.spend-a.spend))}
 <h2>Последние 14 дней — заявки по дням</h2>${bars(L.trend,'res',r=>`${r.key}: ${n(r.res)} заявок, ${money(r.spend)}`)}`+histBlock();
})();
function histBlock(){const h=DATA.history.filter(x=>x.spend);if(h.length<2)return'';return `<h2>История отчётов — расход по дням</h2>${bars(h,'spend',r=>`${r.date}: ${money(r.spend)}, ${n(r.res)} заявок`)}`}

// ---------- Креативы за 7 дней
(function(){const L=DATA.latest,el=$('#s-ads');
 const rows=L&&L.active?L.ads_7:(DATA.launch&&DATA.launch.geos.KZ?DATA.launch.geos.KZ.ads:[]);
 const note=L&&L.active?`7 дней до ${L.date}`:'Активных кампаний нет — показаны объявления прошлого запуска KZ за весь срок';
 el.innerHTML=`<p class="lead">${note}. Сортировка — по клику на заголовок колонки.</p>`+table([['Объявление · вердикт',r=>`${r.thumb?`<img class="thumb" src="${r.thumb}" loading="lazy" alt="">`:''}<b>${r.ad_name}</b> <small>${r.fmt||''} · ${r.adset_name||''}</small><div style="clear:both;min-width:170px">${tags(r.verdicts)}</div>`],...COLS(['',()=>'']).slice(1),['Досмотр 3 с',r=>pct(r.hook),r=>cls(r.hook,B.hook,25),'opt']],[...rows].sort((a,b)=>b.spend-a.spend));
})();

// ---------- Воронка
(function(){const L=DATA.latest,el=$('#s-funnel');const K=DATA.launch&&DATA.launch.geos.KZ;
 let h='<p class="lead">Реклама видит только заявки. Созвоны и закупки берутся из таблицы «Продажи.csv» — без неё пульт не покажет, какие креативы приводят покупателей.</p>';
 const fun=(title,t,calls,sales)=>`<h3>${title}</h3><div class="funnel">
  <div><small>Расход</small><b>${money(t.spend)}</b></div><div><small>Клики</small><b>${n(t.lc)}</b><small>${money(t.cpc)} за клик</small></div>
  <div><small>Дошли до страницы</small><b>${n(t.lpv)}</b><small>${fm(t.lpv_rate,0)}% кликов</small></div>
  <div><small>Заявки</small><b>${n(t.res)}</b><small>${money(t.cpl)}</small></div>
  <div><small>Созвоны</small><b>${calls==null?'—':n(calls)}</b><small>${calls?money(t.spend/calls):'нет данных'}</small></div>
  <div><small>Закупки</small><b>${sales==null?'—':n(sales)}</b><small>${sales?money(t.spend/sales)+' за клиента':'нет данных'}</small></div></div>`;
 if(L&&L.active){for(const c of L.campaigns){const f=L.funnel[c]||{};const t=L.ads_7.filter(a=>a.campaign_name===c).reduce((s,a)=>{['spend','lc','lpv','res'].forEach(k=>s[k]=(s[k]||0)+a[k]);return s},{});t.cpc=t.lc?t.spend/t.lc:null;t.cpl=t.res?t.spend/t.res:null;t.lpv_rate=t.lc?100*t.lpv/t.lc:null;h+=fun(c+' · 7 дней',t,f.calls,f.sales)}}
 if(K)h+=fun('Прошлый запуск KZ 06.05 · весь срок (закупки — со слов Евгения)',K.total,null,K.sales);
 h+=`<h2>Как вести «Продажи.csv»</h2><div class="card">Файл лежит рядом с пультом, открывается в Excel. Одна строка — одна заявка: <b>Дата заявки; Кампания; Объявление; Созвон (да/нет); Закупка (да/нет); Сумма €; Комментарий</b>. Название кампании — как в кабинете, объявление — как в метке utm_content. Без телефонов и имён клиентов.</div>`;
 el.innerHTML=h;
})();

// ---------- Надёжность и журнал
(function(){const R=DATA.trust,el=$('#s-trust');
 const cal=Object.values(R.calib);
 const sig=R.signals.filter(s=>s.n>=10);
 el.innerHTML=`<p class="lead">Насколько можно верить советам пульта. Каждое правило проверено на прошлом запуске 06.05: совет за день D сравнивается с тем, что реально случилось следующие 7 дней.</p>
 <div class="cards">
  <div class="card"><b>Что это значит</b>Без всякого правила объявление попадает в цель (заявка ≤ ${fm(T*1.2,1)} $) на следующей неделе примерно в 30% случаев. Правило полезно, если верно заметно чаще.</div>
  <div class="card scale"><b>Работает: группы за 14 дней</b>«Масштабировать группу при заявке ≤ 0,8 цели и 3+ заявках за 14 дней» — верно в 59% против 29% без правила.</div>
  <div class="card off"><b>Не работает: «выключить дорогое»</b>Дорогая заявка за неделю не предсказывает следующую: 55–62% против 60% без правила. Почти всё дорожает со временем — главный рычаг не выключать, а вовремя менять креативы.</div>
  <div class="card"><b>По одному дню решений нет</b>Объявление приносит ~1 заявку в день. Пока за период меньше ~5 заявок или 50 визитов на страницу, вывод помечается ⚪.</div>
 </div>
 <h2>Правила, которые использует пульт</h2>${table([['Правило',r=>r.text,()=>'t'],['Верно',r=>r.hit+'%',r=>r.hit>=r.base+10?'good':r.hit<=r.base?'bad':''],['Без правила',r=>r.base+'%'],['Случаев',r=>r.n]],cal)}
 <h2>Все проверенные сигналы</h2>${table([['Сигнал',r=>`${r.kind==='scale'?'⬆️':'⏸'} ${r.rule}`,()=>'t'],['Уровень · окно',r=>`${r.level} · ${r.win} дн.`,()=>'t'],['Верно',r=>r.hit+'%',r=>{const b=r.kind==='scale'?r.base_good:r.base_bad;return r.hit>=b+10?'good':r.hit<=b?'bad':''}],['Без правила',r=>(r.kind==='scale'?r.base_good:r.base_bad)+'%'],['Случаев',r=>r.n]],sig)}
 <h2>Журнал гипотез</h2>${R.log.length?table([['Гипотеза',r=>`<b>${r['Гипотеза']}</b><br><small>${r['Дата']} · ${r['ID']}</small>`,()=>'t'],['Доверие',r=>CONF[r['Доверие']]||r['Доверие'],()=>'t'],['Под риском',r=>r['Под риском $']+' $'],['Статус',r=>r['Статус'],()=>'t'],['Что сделали / результат',r=>[r['Что сделали'],r['Результат']].filter(Boolean).join(' → ')||'—',()=>'t']],R.log):'<div class="empty">Журнал пуст — гипотезы появятся с первым ежедневным отчётом по активной кампании.</div>'}
 <div class="card" style="margin-top:10px">Журнал — файл <b>«Журнал гипотез.csv»</b> рядом с пультом. Пульт сам дописывает новые гипотезы со статусом «новая». Ты меняешь статус (в тесте / подтвердилась / не подтвердилась / отклонена) и пишешь, что сделали и что вышло — через пару недель станет видно, какие советы реально давали эффект.</div>`;
})();

// ---------- Прошлый запуск
(function(){const P=DATA.launch,el=$('#s-launch');if(!P){el.innerHTML='<div class="empty">Нет данных прошлого запуска.</div>';return}
 const geos=Object.keys(P.geos);
 el.innerHTML=`<p class="lead">Запуск на shopitaly.biz с 06.05 по 21.07.2026: KZ — 1 556 $, 112 заявок, 5 закупок, клиент ≈ 311 $. Это ориентиры для нового запуска.</p>
 <h2>Главные выводы</h2><div class="cards">${P.findings.map(([a,b])=>`<div class="card"><b>${a}</b>${b}</div>`).join('')}</div>
 <h2>Гипотезы на повторный запуск</h2>${table([['Гипотеза',r=>`<b>${r[0]}</b>`,()=>'t'],['Зачем',r=>r[1],()=>'t'],['Как проверить',r=>r[2],()=>'t']],P.hypotheses)}
 <div class="row"><h2 style="margin:26px 12px 10px 0">Разбивки</h2><select id="geo">${geos.map(g=>`<option value="${g}">${DATA.geos[g]}</option>`).join('')}</select></div><div id="geoBox"></div>`;
 const draw=g=>{const G=P.geos[g],t=G.total;
  $('#geoBox').innerHTML=`<div class="kpis">
   <div class="kpi"><small>Расход</small><b>${money(t.spend)}</b></div><div class="kpi"><small>Заявки</small><b>${n(t.res)}</b></div>
   <div class="kpi"><small>Цена заявки</small><b>${money(t.cpl)}</b></div><div class="kpi"><small>CTR</small><b>${pct(t.ctr)}</b></div>
   <div class="kpi"><small>До страницы</small><b>${fm(t.lpv_rate,0)}%</b></div><div class="kpi"><small>Страница → заявка</small><b>${pct(t.page_cr)}</b></div>
   ${G.sales?`<div class="kpi"><small>Закупки · цена клиента</small><b>${G.sales} · ${money(t.spend/G.sales)}</b></div>`:''}</div>
  <h3>Заявки по дням</h3>${bars(G.daily,'res',r=>`${r.key}: ${n(r.res)} заявок, ${money(r.spend)}, CPM ${money(r.cpm)}`)}
  <h3>По месяцам</h3>${table(COLS(['Месяц',r=>r.key]),G.month)}
  <h3>Тексты объявлений</h3>${table(COLS(['Текст',r=>r.key]),G.body||[])}
  <h3>Заголовки</h3>${table(COLS(['Заголовок',r=>r.key]),G.title||[])}
  ${(G.video||[]).length?`<h3>Видео</h3>${table([...COLS(['Видео',r=>r.key]),['Досмотр 3 с',r=>pct(r.hook)]],G.video)}`:''}
  <h3>Картинки</h3>${table(COLS(['Картинка',r=>r.key]),G.image||[])}
  <h3>Плейсменты</h3>${table(COLS(['Плейсмент',r=>r.key]),G.placement)}
  <h3>Пол и возраст</h3>${table(COLS(['Аудитория',r=>r.key]),G.age_gender)}
  <h3>Устройства</h3>${table(COLS(['Устройство',r=>r.key]),G.device)}
  <h3>Дни недели (часовой пояс кабинета)</h3>${table(COLS(['День',r=>['пн','вт','ср','чт','пт','сб','вс'][r.key]]),G.weekday)}
  <h3>Группы объявлений</h3>${table(COLS(['Группа',r=>r.key]),G.adset)}`};
 $('#geo').onchange=e=>draw(e.target.value);draw(geos[0]);
})();
show(saved&&document.getElementById(saved)?saved:'s-day');
</script></body></html>
