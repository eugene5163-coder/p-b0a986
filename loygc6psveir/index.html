td.t{text-align:left}tr:hover td{background:color-mix(in srgb,var(--acc) 8%,var(--card))}

.tag.off{background:var(--bad-bg);color:var(--bad)}.tag.scale{background:var(--good-bg);color:var(--good)}.tag.warn{background:var(--warn-bg);color:var(--warn)}

.bar.zero{background:var(--line)}

 креатив", "1.MOV: 28 заявок по 10 $, конверсия страницы 10,4%. Другие видео (5.x, 6.x, 7.x) — 15–24 $ за заявку."], ["Плейсменты", "Instagram Stories — конверсия страницы 14,1%, Reels — 10,6 $ за заявку. Лента Instagram забрала 40% бюджета при 17,5 $ за заявку. Audience Network: 59 $, CTR 11,5% и 2 заявки — случайные клики."], ["Бюджет раздроблен", "8 групп по 10–16 $ в день и 64 объявления, ~1 заявка в день на группу. Ни одна группа не вышла из обучения (нужно ~50 событий в неделю)."], ["Нет ретаргета и исключений", "Широкая аудитория 25–65 по всему Казахстану, без исключения тех, кто уже оставил заявку, и без догрева 1 565 посетителей страницы."]], "hypotheses": [["Первый экран /premium/ под обещание рекламы «первая закупка без ошибок» (или отдельная версия страницы)", "Совпадение обещания рекламы и первого экрана", "50/50 тот же креатив на старую и новую версию; решение по созвонам и закупкам"], ["Короткая лёгкая страница, один CTA (разбор 15 мин), выбор страны в телефоне", "Вернуть треть потерянных кликов", "Клик → просмотр страницы ≥ 85%"], ["1–2 группы вместо 8, бюджет 30–40 $ в день на группу", "Выйти из обучения, стабилизировать цену", "≥ 50 заявок в неделю на группу, цена заявки по неделям"], ["3–4 новых видео Натальи по механике 1.MOV, вертикаль 9:16", "Креатив — главный рычаг; запас на смену при выгорании", "Новые видео против 1.MOV в одной группе, цена заявки и досмотр 3 с"], ["Обычные объявления вместо динамических на этапе теста текстов", "Каждый текст и заголовок получает свой бюджет", "По 3–4 дня на вариант, победитель — в динамику"], ["Исключить Audience Network, вертикальные форматы — приоритет", "Убрать случайные клики", "Цена заявки по плейсментам"], ["Ретаргет на посетителей страницы и досмотревших видео + исключение оставивших заявку", "Дожать тёплых дешевле холодных", "Отдельная группа, 5–10 $ в день, цена заявки"], ["Оптимизация на квалифицированную заявку (CAPI + отметка «созвон» в таблице продаж)", "Алгоритм учится на тех, кто покупает", "  el.innerHTML=`<p class="lead">Насколько можно верить советам пульта. Каждое правило проверено на прошлом запуске 06.05: совет за день D сравнивается с тем, что реально случилось следующие 7 дней.</p>

  <div class="card scale"><b>Работает: группы за 14 дней</b>«Масштабировать группу при заявке ≤ 0,8 цели и 3+ заявках за 14 дней» — верно в 59% против 29% без правила.</div>

 <h2>Журнал гипотез</h2>${R.log.length?table([['Гипотеза',r=>`<b>${r['Гипотеза']}</b><br><small>${r['Дата']} · ${r['ID']}</small>`,()=>'t'],['Доверие',r=>CONF[r['Доверие']]||r['Доверие'],()=>'t'],['Под риском',r=>r['Под риском $']+' $'],['Статус',r=>r['Статус'],()=>'t'],['Что сделали / результат',r=>[r['Что сделали'],r['Результат']].filter(Boolean).join(' → ')||'—',()=>'t']],R.log):'<div class="empty">Журнал пуст — гипотезы появятся с первым ежедневным отчётом по активной кампании.</div>'}
